<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Womit ich arbeite">
  <style>
    .sweep { animation: sweep 4.5s linear infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(1500px); } }
    @keyframes blink { 0% { fill-opacity: 1; } 50% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DC143C" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#DC143C" stop-opacity="1"/>
      <stop offset="1" stop-color="#DC143C" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" rx="14" fill="#171B2E"/>
  <line x1="64" y1="48" x2="116" y2="48" stroke="#DC143C" stroke-width="2"/>
  <text x="136" y="55" font-family="'DM Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" font-weight="600" letter-spacing="5" fill="#DC143C">TOOLS<tspan class="blink" dx="6">_</tspan></text>
  <text x="62" y="120" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#F2EFE7">Womit ich <tspan font-style="italic" fill="#DC143C">arbeite</tspan></text>
  <rect x="0" y="146" width="1200" height="2" fill="#2C3350"/>
  <rect class="sweep" x="-300" y="146" width="300" height="3" fill="url(#g)"/>
</svg>
