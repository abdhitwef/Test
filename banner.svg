<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-label="Damian – tüftelt, baut, lernt.">
  <style>
    .pill  { animation: fadeDown .8s ease-out .1s backwards; }
    .name  { animation: rise 1s cubic-bezier(.2,.7,.2,1) .35s backwards; }
    .tag   { animation: rise 1s cubic-bezier(.2,.7,.2,1) .85s backwards; }
    .rule  { --l: 1072; animation: draw 1.1s ease-out 1.2s backwards; }
    .caps  { animation: fade 1s ease-out 1.7s backwards; }
    .mesh line { animation: draw 1.2s ease-out backwards; }
    .node  { animation: twinkle 3.2s ease-in-out infinite alternate; }
    .dot   { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; animation: ring 2.6s ease-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes rise     { from { opacity: 0; transform: translateY(28px); } }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-14px); } }
    @keyframes fade     { from { opacity: 0; } }
    @keyframes draw     { from { stroke-dasharray: var(--l); stroke-dashoffset: var(--l); }
                          to   { stroke-dasharray: var(--l); stroke-dashoffset: 0; } }
    @keyframes twinkle  { from { opacity: .3; } to { opacity: 1; } }
    @keyframes pulse    { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.55); opacity: .5; } }
    @keyframes ring     { from { transform: scale(1); opacity: .85; } to { transform: scale(4.5); opacity: 0; } }
    @keyframes blink    { 0% { fill-opacity: 1; } 50% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="450" rx="14" fill="#171B2E"/>

  <g class="mesh" stroke="#2C3350" stroke-width="1.5" fill="none" opacity="0.9">
      <line x1="820" y1="330" x2="900" y2="200" style="--l:152.6;animation-delay:0.20s"/>
      <line x1="900" y1="200" x2="1010" y2="130" style="--l:130.4;animation-delay:0.29s"/>
      <line x1="1010" y1="130" x2="1100" y2="215" style="--l:123.8;animation-delay:0.38s"/>
      <line x1="1100" y1="215" x2="1040" y2="330" style="--l:129.7;animation-delay:0.47s"/>
      <line x1="1040" y1="330" x2="940" y2="385" style="--l:114.1;animation-delay:0.56s"/>
      <line x1="940" y1="385" x2="820" y2="330" style="--l:132.0;animation-delay:0.65s"/>
      <line x1="900" y1="200" x2="940" y2="385" style="--l:189.3;animation-delay:0.74s"/>
      <line x1="900" y1="200" x2="1040" y2="330" style="--l:191.0;animation-delay:0.83s"/>
      <line x1="1010" y1="130" x2="1040" y2="330" style="--l:202.2;animation-delay:0.92s"/>
      <line x1="900" y1="200" x2="860" y2="110" style="--l:98.5;animation-delay:1.01s"/>
      <line x1="860" y1="110" x2="1010" y2="130" style="--l:151.3;animation-delay:1.10s"/>
      <line x1="1010" y1="130" x2="1130" y2="90" style="--l:126.5;animation-delay:1.19s"/>
      <line x1="1130" y1="90" x2="1100" y2="215" style="--l:128.5;animation-delay:1.28s"/>
      <line x1="1100" y1="215" x2="1150" y2="320" style="--l:116.3;animation-delay:1.37s"/>
      <line x1="1150" y1="320" x2="1040" y2="330" style="--l:110.5;animation-delay:1.46s"/>
  </g>
  <g fill="#3A4366">
      <circle class="node" cx="820" cy="330" r="3.5" style="animation-delay:0.00s"/>
      <circle class="node" cx="900" cy="200" r="3.5" style="animation-delay:0.45s"/>
      <circle class="node" cx="1010" cy="130" r="3.5" style="animation-delay:0.90s"/>
      <circle class="node" cx="1100" cy="215" r="3.5" style="animation-delay:1.35s"/>
      <circle class="node" cx="1040" cy="330" r="3.5" style="animation-delay:1.80s"/>
      <circle class="node" cx="940" cy="385" r="3.5" style="animation-delay:2.25s"/>
      <circle class="node" cx="1150" cy="320" r="3.5" style="animation-delay:2.70s"/>
      <circle class="node" cx="860" cy="110" r="3.5" style="animation-delay:0.15s"/>
      <circle class="node" cx="1130" cy="90" r="3.5" style="animation-delay:0.60s"/>
  </g>
  <circle cx="1010" cy="130" r="6" fill="#DC143C"/>
  <circle class="ring" cx="1010" cy="130" r="6" fill="none" stroke="#DC143C" stroke-width="2"/>

  <g class="pill">
    <rect x="64" y="40" width="420" height="44" rx="22" fill="#DC143C" fill-opacity="0.12" stroke="#DC143C" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle class="dot" cx="92" cy="62" r="7" fill="#DC143C"/>
    <text x="112" y="68" font-family="'DM Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" letter-spacing="3" fill="#F2EFE7">WILLKOMMEN AUF MEINEM GITHUB</text>
  </g>

  <text class="name" x="60" y="250" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="150" font-weight="700" fill="#F2EFE7">Damian</text>
  <text class="tag" x="64" y="318" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" font-style="italic" fill="#DC143C">tüftelt, baut, lernt.<tspan class="cursor" font-style="normal" dx="6">_</tspan></text>

  <line class="rule" x1="64" y1="360" x2="1136" y2="360" stroke="#2C3350" stroke-width="2"/>
  <text class="caps" x="64" y="406" font-family="'DM Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" letter-spacing="6" fill="#F2EFE7" fill-opacity="0.7">CODE  ·  WEB  ·  PROJEKTE  ·  TÜFTELN</text>
</svg>
